<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productive X - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-color) 0%, #1e1b4b 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      text-align: center;
    }
    .auth-logo {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .auth-subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .auth-tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }
    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      transition: var(--transition);
    }
    .auth-tab.active {
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
    }
    .form-group { text-align: left; }
    .toggle-form { display: none; }
    .toggle-form.active { display: block; }
  </style>
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <div class="auth-container">
    <div class="card glass auth-card">
      <div class="auth-logo">
        <i class="fa-solid fa-bolt"></i> Productive X
      </div>
      <p class="auth-subtitle">One Workspace. Every Goal.</p>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login">Login</div>
        <div class="auth-tab" id="tab-register">Register</div>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="toggle-form active">
        <div id="login-error" style="color: var(--danger-color); font-size: 0.9rem; margin-bottom: 1rem; text-align: center;"></div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="login-email" class="form-control" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="toggle-form">
        <div id="reg-error" style="color: var(--danger-color); font-size: 0.9rem; margin-bottom: 1rem; text-align: center;"></div>
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="reg-email" class="form-control" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-control" required placeholder="Create a password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          <i class="fa-solid fa-user-plus"></i> Register
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
